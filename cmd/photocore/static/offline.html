<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Оффлайн режим - PhotoCore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --md-surface: #121212;
            --md-on-surface: #e6e1e5;
            --md-surface-container: #1c1c1c;
            --md-outline-variant: #3e3e3e;
            --md-tertiary: #8ab4f8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
        }

        /* Offline toast */
        .offline-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            min-width: 280px;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .offline-toast.visible {
            display: flex;
        }

        .offline-toast.online {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
        }

        .offline-toast svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .offline-toast-content {
            flex: 1;
        }

        .toast-reload-btn {
            padding: 8px 20px;
            background: white;
            color: #37b24d;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toast-reload-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        /* Header */
        .header {
            background: var(--md-surface-container);
            border-bottom: 1px solid var(--md-outline-variant);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--md-on-surface);
            font-weight: 600;
            font-size: 1.25rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
        }

        /* Content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .section-subtitle {
            color: #938f99;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .cache-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cache-item {
            background: var(--md-surface-container);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.2s;
            text-decoration: none;
            color: var(--md-on-surface);
        }

        .cache-item:hover {
            background: #252525;
        }

        .cache-item svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .cache-item-title {
            font-weight: 500;
            font-size: 1rem;
        }

        .cache-item-path {
            font-size: 0.85rem;
            color: #938f99;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #938f99;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #938f99;
        }
    </style>
</head>
<body>
    <!-- Toast уведомление об оффлайн режиме (управляется через pwa.js) -->
    <div class="offline-toast" id="offline-toast">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" id="toast-icon">
            <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM17.04 15.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/>
        </svg>
        <div class="offline-toast-content">
            <span id="toast-text">Нет соединения - работаем оффлайн</span>
        </div>
        <button class="toast-reload-btn" id="toast-reload-btn" style="display: none;" onclick="location.reload()">Обновить</button>
    </div>

    <!-- Header -->
    <header class="header">
        <a href="/gallery" class="logo">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 6h-3.17L16 4h-6v2h5.12l1.83 2H21v12H5v-9H3v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
                <path d="M8 14c0 2.76 2.24 5 5 5s5-2.24 5-5-2.24-5-5-5-5 2.24-5 5zm5-3c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3z"/>
            </svg>
            <span class="logo-text">PhotoCore</span>
        </a>
    </header>

    <!-- Content -->
    <div class="container">
        <h1 class="section-title">Доступно оффлайн</h1>
        <p class="section-subtitle">Эти страницы сохранены и доступны без подключения к интернету</p>

        <div id="cache-content">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        // Offline Toast управляется через pwa.js
        const cacheContent = document.getElementById('cache-content');

        // Получаем закешированные страницы
        async function loadCachedPages() {
            try {
                // Только эти страницы показываем
                const allowedPages = [
                    { path: '/gallery', name: 'Галерея' },
                    { path: '/albums', name: 'Альбомы' },
                    { path: '/favorites', name: 'Избранное' }
                ];

                const cachedPages = [];
                const cacheNames = await caches.keys();

                // Проверяем каждую разрешенную страницу
                for (const page of allowedPages) {
                    let found = false;

                    for (const cacheName of cacheNames) {
                        const cache = await caches.open(cacheName);
                        const response = await cache.match(page.path);

                        if (response) {
                            found = true;
                            break;
                        }
                    }

                    // Добавляем только если нашли в кэше
                    if (found) {
                        cachedPages.push(page);
                    }
                }

                displayCachedPages(cachedPages);
            } catch (error) {
                console.error('Error loading cached pages:', error);
                cacheContent.innerHTML = `
                    <div class="empty-state">
                        <p>Ошибка загрузки кешированных страниц</p>
                    </div>
                `;
            }
        }

        // Отображаем список страниц
        function displayCachedPages(pages) {
            if (pages.length === 0) {
                cacheContent.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        <p>Нет сохраненных страниц</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Посетите страницы онлайн, чтобы они сохранились для оффлайн просмотра</p>
                    </div>
                `;
                return;
            }

            const html = `
                <ul class="cache-list">
                    ${pages.map(page => {
                        const icon = getIconForPage(page.path);
                        return `
                            <li>
                                <a href="${page.path}" class="cache-item">
                                    ${icon}
                                    <div>
                                        <div class="cache-item-title">${page.name}</div>
                                        <div class="cache-item-path">${page.path}</div>
                                    </div>
                                </a>
                            </li>
                        `;
                    }).join('')}
                </ul>
            `;

            cacheContent.innerHTML = html;
        }

        // Иконки для страниц
        function getIconForPage(path) {
            const icons = {
                '/gallery': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-3.17L16 4h-6v2h5.12l1.83 2H21v12H5v-9H3v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>',
                '/favorites': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
                '/albums': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'
            };
            return icons[path] || '';
        }

        // Инициализация
        loadCachedPages();
    </script>

    <!-- PWA Module для управления offline toast -->
    <script src="/static/pwa.js"></script>
</body>
</html>
